<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F1EEE7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>Finance Dashboard</title>

    <!--
      Pre-paint device detection. Runs synchronously before any
      stylesheet renders, so mobile-only rules (variables.css and
      mobile.css, both scoped under [data-device="mobile"]) apply
      on the very first paint. js/app.js installs a matchMedia
      listener after boot to keep this in sync on viewport changes.

      Same script resolves the UX generation flag.
        · v2 (default) — the compositional "wealth operating system"
          treatment: card chapters, tier-color edges, editorial
          typography. See css/ux-v2.css.
        · v1 — legacy editorial flat layout. Kept as an escape hatch
          for anyone who wants the previous experience.
      Order of precedence: ?ux=v1|v2 query param (sticks via
      localStorage) → localStorage 'ux' key → default 'v2'.
    -->
    <script>
      document.documentElement.dataset.device =
        window.matchMedia('(max-width: 640px)').matches ? 'mobile' : 'desktop';
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var fromUrl = params.get('ux');
          if (fromUrl === 'v1' || fromUrl === 'v2') {
            localStorage.setItem('ux', fromUrl);
          }
          var ux = localStorage.getItem('ux');
          if (ux !== 'v1' && ux !== 'v2') ux = 'v2';
          document.documentElement.dataset.ux = ux;
          // Public display/demo mode — `?v_display`. Set as a data
          // attribute before paint so CSS can hide mutation/auth UI on
          // first render. NO localStorage write; the URL param is the
          // sole source of truth (see js/demo-mode.js).
          if (params.has('v_display')) {
            document.documentElement.dataset.demoMode = 'true';
          }
        } catch (e) {
          document.documentElement.dataset.ux = 'v2';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for English, Heebo for Hebrew — both loaded, CSS switches via :lang() -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <!-- Mobile product layer — must load last so its
         body[data-device="mobile"]-scoped rules override
         earlier stylesheets. Desktop is untouched. -->
    <link rel="stylesheet" href="css/mobile.css" />
    <!-- UX v2 layer — scoped under [data-ux="v2"]. Linked last so its
         rules override base + mobile. v1 stays default until we flip
         the boot script; v2 is reachable today via ?ux=v2. -->
    <link rel="stylesheet" href="css/ux-v2.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Injected by nav.js -->
        </nav>
        <div class="sidebar-footer">
          <span class="sidebar-footer-label" id="sidebar-footer-label"
            >Personal Dashboard</span
          >
          <!-- Desktop entry point for Admin (owner config + backup/
               restore + reset all live inside it). requires-write so it's
               hidden in demo mode; tooltip set by nav.js renderNav(). -->
          <button
            class="sidebar-footer-btn requires-write"
            id="sidebar-admin"
            onclick="navigateToAdmin()"
            title="Admin"
            aria-label="Admin"
          >
            <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M3 5h7M13 5h2M3 13h2M8 13h7" />
              <circle cx="11.5" cy="5" r="1.6" />
              <circle cx="6.5" cy="13" r="1.6" />
            </svg>
          </button>
          <div class="lang-toggle">
            <button
              class="lang-btn active"
              id="lang-btn-en"
              onclick="setLanguage('en')"
            >
              EN
            </button>
            <button
              class="lang-btn"
              id="lang-btn-he"
              onclick="setLanguage('he')"
            >
              עב
            </button>
          </div>
          <button class="sidebar-signout requires-write" id="sidebar-signout" onclick="signOut()">
            Sign out
          </button>
        </div>
      </aside>

      <!-- Mobile sidebar overlay -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- Mobile top bar.
           Tablet tier (641-860px): hamburger button on the inline-start
             side opens the side-drawer (the rail is hidden there).
           Phone tier (≤640px):     turns into an iOS-style nav bar with
             a centered title that mirrors the currently-active section
             (driven by nav.js's section observer). Hamburger is hidden
             because the bottom-tab bar handles primary nav. -->
      <header class="topbar" id="topbar">
        <button
          class="topbar-menu-btn"
          id="menu-toggle"
          aria-label="Toggle menu"
        >
          <span></span><span></span><span></span>
        </button>
        <span class="topbar-title" id="topbar-title"></span>
      </header>

      <!-- Main content -->
      <main class="main-content" id="main-content">
        <div class="content-wrapper" id="app-content">
          <!-- Sections injected by page modules -->
        </div>
      </main>

      <!--
        Mobile bottom shell — tab bar + FAB. Hidden on tablet/desktop
        via CSS; appears on phones (≤640px). The tabs themselves are
        injected by js/components/nav.js (renderBottomTabs).
      -->
      <nav
        class="bottom-tabs"
        id="bottom-tabs"
        role="navigation"
        aria-label="Primary"
      >
        <!-- Tabs injected by nav.js -->
      </nav>

      <button
        class="fab requires-write"
        id="fab-quick-expense"
        type="button"
        aria-label="Quick expense"
        onclick="openQuickAddPicker()"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <!-- Modal — outside app-shell so it overlays everything -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <!-- Drag handle — only visible when the card renders as a
             bottom sheet (mobile). Tappable target for the swipe-
             dismiss gesture; also doubles as a visual affordance. -->
        <div class="modal-grabber" aria-hidden="true">
          <span class="modal-grabber-bar"></span>
        </div>
        <div class="modal-header">
          <h3 class="modal-title" id="modal-title"></h3>
          <button
            class="modal-close-btn"
            onclick="closeModal()"
            aria-label="Close"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M2 2l12 12M14 2L2 14" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Form injected by modal.js -->
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-ghost"
            id="modal-cancel-btn"
            onclick="closeModal()"
          >
            Cancel
          </button>
          <button
            class="btn btn-primary"
            id="modal-save-btn"
            onclick="handleModalSave()"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!--
      Single module entry. js/app.js statically imports every other
      module, so the browser handles load order from the dependency
      graph. Real state is persisted to Supabase + localStorage; the
      bundled data/state.example.js is only used as the demo bootstrap.

      Modules require HTTP — this page must be served from a local
      static server (e.g. `python3 -m http.server`), not opened via
      file://. CORS forbids module loading otherwise.
    -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
