<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F1EEE7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>Finance Dashboard</title>

    <!--
      Pre-paint device detection. Runs synchronously before any
      stylesheet renders, so mobile-only rules (variables.css and
      mobile.css, both scoped under [data-device="mobile"]) apply
      on the very first paint. js/app.js installs a matchMedia
      listener after boot to keep this in sync on viewport changes.
    -->
    <script>
      document.documentElement.dataset.device =
        window.matchMedia('(max-width: 640px)').matches ? 'mobile' : 'desktop';
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for English, Heebo for Hebrew — both loaded, CSS switches via :lang() -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <!-- Mobile product layer — must load last so its
         body[data-device="mobile"]-scoped rules override
         earlier stylesheets. Desktop is untouched. -->
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <span class="logo-mark">F</span>
          <span class="logo-text">Finance</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Injected by nav.js -->
        </nav>
        <div class="sidebar-footer">
          <span class="sidebar-footer-label" id="sidebar-footer-label"
            >Personal Dashboard</span
          >
          <div class="lang-toggle">
            <button
              class="lang-btn active"
              id="lang-btn-en"
              onclick="setLanguage('en')"
            >
              EN
            </button>
            <button
              class="lang-btn"
              id="lang-btn-he"
              onclick="setLanguage('he')"
            >
              עב
            </button>
          </div>
          <button class="sidebar-signout" id="sidebar-signout" onclick="signOut()">
            Sign out
          </button>
        </div>
      </aside>

      <!-- Mobile sidebar overlay -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- Mobile top bar -->
      <header class="topbar" id="topbar">
        <div class="topbar-logo">
          <span class="logo-mark">F</span>
          <span class="logo-text">Finance</span>
        </div>
        <button
          class="topbar-menu-btn"
          id="menu-toggle"
          aria-label="Toggle menu"
        >
          <span></span><span></span><span></span>
        </button>
      </header>

      <!-- Main content -->
      <main class="main-content" id="main-content">
        <div class="content-wrapper" id="app-content">
          <!-- Sections injected by page modules -->
        </div>
      </main>

      <!--
        Mobile bottom shell — tab bar + FAB. Hidden on tablet/desktop
        via CSS; appears on phones (≤640px). The tabs themselves are
        injected by js/components/nav.js (renderBottomTabs).
      -->
      <nav
        class="bottom-tabs"
        id="bottom-tabs"
        role="navigation"
        aria-label="Primary"
      >
        <!-- Tabs injected by nav.js -->
      </nav>

      <button
        class="fab"
        id="fab-quick-expense"
        type="button"
        aria-label="Quick expense"
        onclick="openQuickAddPicker()"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <!-- Modal — outside app-shell so it overlays everything -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <!-- Drag handle — only visible when the card renders as a
             bottom sheet (mobile). Tappable target for the swipe-
             dismiss gesture; also doubles as a visual affordance. -->
        <div class="modal-grabber" aria-hidden="true">
          <span class="modal-grabber-bar"></span>
        </div>
        <div class="modal-header">
          <h3 class="modal-title" id="modal-title"></h3>
          <button
            class="modal-close-btn"
            onclick="closeModal()"
            aria-label="Close"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M2 2l12 12M14 2L2 14" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Form injected by modal.js -->
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-ghost"
            id="modal-cancel-btn"
            onclick="closeModal()"
          >
            Cancel
          </button>
          <button
            class="btn btn-primary"
            id="modal-save-btn"
            onclick="handleModalSave()"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!--
      Single module entry. js/app.js statically imports every other
      module, so the browser handles load order from the dependency
      graph. Real state is persisted to Supabase + localStorage; the
      bundled data/state.example.js is only used as the demo bootstrap.

      Modules require HTTP — this page must be served from a local
      static server (e.g. `python3 -m http.server`), not opened via
      file://. CORS forbids module loading otherwise.
    -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
